<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">Independent sensor estimation and joint timing analysis</title>
<desc id="desc">Camera images and Livox Avia measured returns independently produce angles and estimated RPM. Their results are compared with validation metrics and cross-speed circular phase regression.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657780"/></marker></defs>
<rect width="1440" height="590" rx="24" fill="#f5f8fa"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="48" font-size="26" font-weight="700" fill="#18323b">From measured observations to timing evidence</text>
<text x="48" y="78" font-size="17" fill="#586b73">Each sensor infers its own speed. No commanded RPM or encoder is supplied.</text>
<g fill="#fff" stroke-width="2">
<rect x="48" y="112" width="406" height="158" rx="16" stroke="#17867e"/>
<rect x="518" y="112" width="406" height="158" rx="16" stroke="#17867e"/>
<rect x="988" y="112" width="406" height="158" rx="16" stroke="#17867e"/>
<rect x="48" y="300" width="406" height="158" rx="16" stroke="#d27a35"/>
<rect x="518" y="300" width="406" height="158" rx="16" stroke="#d27a35"/>
<rect x="988" y="300" width="406" height="158" rx="16" stroke="#d27a35"/>
</g>
<g font-size="22" font-weight="700">
<text x="70" y="148" fill="#13776f">Camera images</text><text x="540" y="148" fill="#13776f">Appearance model</text><text x="1010" y="148" fill="#13776f">Frame angles + RPM</text>
<text x="70" y="336" fill="#a85d25">Livox Avia point clouds</text><text x="540" y="336" fill="#a85d25">Return model</text><text x="1010" y="336" fill="#a85d25">Cloud angles + RPM</text>
</g>
<g font-size="19" fill="#334c57">
<text x="70" y="184">Moving-region ellipse calibration</text><text x="70" y="213">Subpixel polar grayscale sampling</text><text x="70" y="242">Gain-normalized spatial harmonics</text>
<text x="540" y="184">Data-only signed-rate initialization</text><text x="540" y="213">Learned periodic template</text><text x="540" y="242">Per-frame phase refinement</text>
<text x="1010" y="184">Held-out template registration</text><text x="1010" y="213">Repeatability + quality flags</text><text x="1010" y="242">Camera geometry zero approximate</text>
<text x="70" y="372">Finite measured returns, every cloud</text><text x="70" y="401">Depth / radial / angular channels</text><text x="70" y="430">336 observed-return features</text>
<text x="540" y="372">Empirical H5/3 rate initialization</text><text x="540" y="401">Regularized noise weighting</text><text x="540" y="430">Per-cloud phase refinement</text>
<text x="1010" y="372">Held-out agreement + scan variability</text><text x="1010" y="401">Raw and optional offline estimates</text><text x="1010" y="430">Physical absolute zero uncalibrated</text>
</g>
<g stroke="#657780" stroke-width="2" marker-end="url(#arrow)"><path d="M458 191 H506"/><path d="M928 191 H976"/><path d="M458 379 H506"/><path d="M928 379 H976"/></g>
<rect x="48" y="492" width="1346" height="68" rx="16" fill="#e7eff8"/>
<text x="70" y="520" font-size="20" font-weight="700" fill="#2b5277">Timing comparison</text>
<text x="70" y="546" font-size="18" fill="#334c57">Free-phase single-bag lag → cross-speed circular phase fit → offset candidate + conditional interval + residuals</text>
<text x="1370" y="520" text-anchor="end" font-size="17" fill="#2b5277">Physical synchronization remains uncalibrated</text>
</g></svg>
