name: Python checks
on: [push, pull_request]
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python -m pip install numpy==1.24.4 scipy==1.10.1 matplotlib==3.7.5
      - name: Compile Python sources
        run: python -m compileall -q -x '/\.venv/|/\.git/' .
      - name: Timing and scan tests (no ROS or bag download required)
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p test_timing.py -v
          python -m unittest discover -s tests -p test_scan_variability.py -v
